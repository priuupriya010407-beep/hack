<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProofPixel Social Safety</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <span class="brand"><span class="mark">P</span> ProofPixel</span>
      <h1>Check this post</h1>
      <p>Select post text or a link on Instagram or Facebook, then run a private, on-demand check.</p>
      <button id="check" type="button">Review selected content</button>
      <p id="status" role="status" aria-live="polite"></p>
      <small>Only your selection and its link are sent to your local ProofPixel app. Nothing runs in the background.</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
